<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO</title>
  <link rel="stylesheet" href="styles.css?v=20260725">
</head>
<body>
  <main class="app">
    <h1>TODO <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button></h1>
    <input id="new-task-input" type="text" placeholder="What needs to be done?" autocomplete="off">
    <div class="filters">
      <button class="filter-btn filter-btn--active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <div class="filters filters--priority">
      <button class="filter-btn filter-btn--active" data-priority-filter="all">All Priority</button>
      <button class="filter-btn" data-priority-filter="high">High</button>
      <button class="filter-btn" data-priority-filter="medium">Medium</button>
      <button class="filter-btn" data-priority-filter="low">Low</button>
    </div>
    <ul id="todo-list"></ul>
    <footer class="app-footer">
      <span class="task-count">0 items left</span>
      <div class="footer-actions">
        <button class="clear-completed">Clear completed</button>
        <button class="export-btn">Export</button>
        <button class="import-btn">Import</button>
        <input type="file" id="import-input" accept=".json" style="display:none">
      </div>
    </footer>
  </main>
  <script src="app.js?v=20260725"></script>
</body>
</html>
